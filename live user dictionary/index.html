<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live User Directory</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container py-5">

        <!-- Heading -->
        <h1 class="text-center text-white mb-4">
            <i class="bi bi-people-fill"></i>
            Live User Directory
        </h1>

        <!-- Search + Sort -->
        <div class="row g-3 mb-4">

            <div class="col-md-8">
                <input
                    type="text"
                    id="searchInput"
                    class="form-control"
                    placeholder="Search users by name...">
            </div>

            <div class="col-md-4">
                <select id="sortSelect" class="form-select">
                    <option value="">Sort Users</option>
                    <option value="az">Name (A-Z)</option>
                    <option value="za">Name (Z-A)</option>
                </select>
            </div>

        </div>

        <!-- User Count -->
        <div class="mb-4 text-center">

            <span class="badge bg-success fs-6 px-3 py-2">

                Total Users :
                <span id="userCount">0</span>

            </span>

        </div>

        <!-- Loading -->
        <div id="loading" class="text-center my-5">

            <div class="spinner-border text-light" style="width:4rem;height:4rem;"></div>

            <h3 class="text-white mt-3">
                Loading Users...
            </h3>

        </div>

        <!-- Error -->
        <div
            id="errorBox"
            class="alert alert-danger text-center d-none">

            <h4>Something went wrong!</h4>

            <p>Unable to fetch users.</p>

            <button
                class="btn btn-danger"
                id="retryBtn">

                Retry

            </button>

        </div>

        <!-- User Cards -->
        <div class="row" id="userContainer"></div>

    </div>

    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
