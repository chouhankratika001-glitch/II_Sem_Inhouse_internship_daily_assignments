DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Admission Form</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }
<!
        body{
            background:#d9f3ff;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            padding:30px;
        }

        .container{
            width:600px;
            background:white;
            padding:30px;
            border-radius:12px;
            box-shadow:0 5px 15px rgba(0,0,0,0.2);
        }

        h1{
            text-align:center;
            color:#005792;
            margin-bottom:10px;
        }

        p{
            text-align:center;
            color:#555;
            margin-bottom:20px;
        }

        hr{
            margin-bottom:20px;
        }

        label{
            font-weight:bold;
            color:#333;
        }

        input[type="text"],
        input[type="email"],
        input[type="date"],
        input[type="tel"],
        input[type="number"],
        select,
        textarea{
            width:100%;
            padding:10px;
            margin-top:5px;
            margin-bottom:15px;
            border:1px solid #ccc;
            border-radius:5px;
        }

        textarea{
            resize:none;
        }

        input:focus,
        select:focus,
        textarea:focus{
            border:2px solid #0077b6;
            outline:none;
        }

        .gender{
            margin:10px 0 15px;
        }

        .gender input{
            margin-left:10px;
        }

        .buttons{
            display:flex;
            justify-content:space-between;
        }

        input[type="submit"],
        input[type="reset"]{
            width:48%;
            padding:12px;
            border:none;
            border-radius:5px;
            color:white;
            font-size:16px;
            cursor:pointer;
        }

        input[type="submit"]{
            background:#28a745;
        }

        input[type="submit"]:hover{
            background:#218838;
        }

        input[type="reset"]{
            background:#dc3545;
        }

        input[type="reset"]:hover{
            background:#c82333;
        }
    </style>
</head>

<body>

<div class="container">

<h1>COLLEGE ADMISSION FORM</h1>
<p>Please fill in all the required details carefully.</p>
<hr>

<form>

<label>Full Name</label>
<input type="text" placeholder="Enter your full name" required>

<label>Date of Birth</label>
<input type="date" required>

<label>Gender</label>

<div class="gender">
<input type="radio" name="gender" required> Male
<input type="radio" name="gender"> Female
<input type="radio" name="gender"> Other
</div>

<label>Email Address</label>
<input type="email" placeholder="Enter your email" required>

<label>Guardian's Email</label>
<input type="email" placeholder="Enter guardian's email" required>

<label>Mobile Number</label>
<input type="tel" placeholder="Enter your mobile number" required>

<label>Address</label>
<textarea rows="3" placeholder="Enter your complete address"></textarea>

<label>Select Course</label>
<select required>
    <option value="">--Choose a Course--</option>
    <option>B.Tech Computer Science</option>
    <option>B.Tech Information Technology</option>
    <option>B.Tech Electronics</option>
    <option>B.Tech Mechanical</option>
    <option>B.Tech Civil</option>
</select>

<label>12th Percentage</label>
<input type="number" min="0" max="100" placeholder="Enter your percentage" required>

<label>Blood Group</label>
<select>
    <option>--Select Blood Group--</option>
    <option>A+</option>
    <option>A-</option>
    <option>B+</option>
    <option>B-</option>
    <option>AB+</option>
    <option>AB-</option>
    <option>O+</option>
    <option>O-</option>
</select>

<label>Upload Passport Size Photo</label>
<input type="file">

<br><br>

<input type="checkbox" required>
I hereby declare that the information provided above is true and correct.

<br><br>

<div class="buttons">
<input type="submit" value="Submit Application">
<input type="reset" value="Reset Form">
</div>

</form>

</div>

</body>
</html>
